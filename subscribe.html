<!DOCTYPE html>
<html lang="en">
  <head>
     <meta charset="UTF-8">
	 <meta name="viewport" content="width=device-width, initial-scale=1.0">
	 <meta http-equiv="Content-Security-Policy"
	        content="default-src 'self';img-src *;
			         media-src *; frame-src https:;">
	<title>Subscribe to ANARCH </title>
	<meta name="description" content="Explore ancient archaeological sites, discover their history, and learn about civilisations.">
	<meta property="og:title" content="ANARCH - Ancient Archaeology">
	<meta property="og description" content="Discover ancient civilisations and explore archaeological sites around the world.">
	<meta property="og:image" content="images/share.jpg">
	<link rel="icon" type="image/png" href="icon.png?v=2">
  </head>
  <body>
    <header>
	   <h1>News and Updates </h1>
	   <nav>
	     <ul>
			 <p><a href="index.html"> Home</a></p>	
		   <!-- one <li> per level 1 page in your sitemap -->
		 </ul>
	   </nav>
	  </header>
	  
	  <main>
	  <p>Stay informed about archaeological discoveries,ancient historical sites and fascinating stories from civilisations around the world.</p>
	   <figure>
	       <img src="subscribe.png" alt="Subscribe to ANARCH" width="800">
	   </figure>  
	   <form action="#" method="get">
	   <fieldset>
	        <legend> Subscription Details</legend>
			<label for="fullname">Full Name:</label>
			<input type="text" id="fullname" name="fullname"
			       autocomplete="name" pattern="[A-Za-z ]+"required>
				   
		    <label for="email">Email Address:</label>
			<input type="email" id="email" name="email"
			       autocomplete="email" required>
				   
		    <label for="phone">Phone Number:</label>
			<input type="tel" id="phone" name="phone"
			       autocomplete="tel">
				   
		    <label for="dob">Date of Birth:</label>
			<input type="date" id="dob" name="dob"
			       autocomplete="bday">
				   
		    <label for="topics">Topics of Interest:</label>

            <select id="topics" name="topics">
                <option value="">Choose a topic</option>
                <option value="roman">Roman Archaeology</option>
                <option value="greek">Ancient Greece</option>
                <option value="discoveries">New Archaeological Discoveries</option>
            </select>
	   </fieldset>
		   <fieldset>
    <legend>How would you like to receive news?</legend>

    <input type="radio" id="email-news" name="delivery" value="email" required>
    <label for="email-news">Email</label>

    <input type="radio" id="sms-news" name="delivery" value="sms">
    <label for="sms-news">SMS</label>
</fieldset>
		    <input type="checkbox" id="consent" name="consent" required>
            <label for="consent">I agree to receive archaeological news and updates.</label>
	        <button type="submit">Subscribe</button>
	   </form>	 
          
	  </main>
	  
	  <footer>

   </body>
 </html>
